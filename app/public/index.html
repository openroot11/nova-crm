<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>SalesForce CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          'surface-container-low': '#eff4ff',
          'on-secondary-container': '#007230',
          'surface-container-high': '#dce9ff',
          'on-primary-container': '#c4d2ff',
          outline: '#737685',
          'error-container': '#ffdad6',
          error: '#ba1a1a',
          'primary-fixed': '#dae2ff',
          'on-primary': '#ffffff',
          'tertiary-fixed': '#ffdad6',
          'surface-container-lowest': '#ffffff',
          'tertiary-fixed-dim': '#ffb4ab',
          'surface-tint': '#0c56d0',
          'on-error': '#ffffff',
          'on-surface': '#0d1c2e',
          'on-tertiary-fixed': '#410002',
          'secondary-fixed-dim': '#62df7d',
          'inverse-surface': '#233144',
          'on-tertiary-fixed-variant': '#93000b',
          'on-secondary-fixed': '#002109',
          'on-primary-fixed-variant': '#0040a2',
          'on-secondary': '#ffffff',
          'secondary-fixed': '#7ffc97',
          surface: '#f8f9ff',
          'tertiary-container': '#b90012',
          'on-error-container': '#93000a',
          'on-surface-variant': '#434654',
          tertiary: '#8c000a',
          'on-tertiary': '#ffffff',
          'surface-dim': '#ccdbf3',
          'surface-bright': '#f8f9ff',
          secondary: '#006e2d',
          'on-tertiary-container': '#ffc5be',
          'on-secondary-fixed-variant': '#005320',
          'surface-variant': '#d5e3fc',
          'on-background': '#0d1c2e',
          'inverse-primary': '#b2c5ff',
          'secondary-container': '#7cf994',
          'primary-container': '#0052cc',
          'outline-variant': '#c3c6d6',
          'inverse-on-surface': '#eaf1ff',
          'primary-fixed-dim': '#b2c5ff',
          background: '#f8f9ff',
          'surface-container-highest': '#d5e3fc',
          primary: '#003d9b',
          'surface-container': '#e6eeff',
          'on-primary-fixed': '#001848',
        },
        borderRadius: {
          DEFAULT: '0.125rem',
          lg: '0.25rem',
          xl: '0.5rem',
          full: '0.75rem',
        },
        spacing: {
          'margin-desktop': '24px',
          gutter: '16px',
          'table-cell-padding': '8px 12px',
          base: '4px',
          'margin-mobile': '16px',
        },
        fontFamily: {
          'headline-lg': ['Inter'],
          'headline-md': ['Inter'],
          'headline-sm': ['Inter'],
          'body-sm': ['Inter'],
          'label-bold': ['Inter'],
          'body-md': ['Inter'],
          'display-kpi': ['Inter'],
        },
        fontSize: {
          'headline-lg': ['30px', { lineHeight: '38px', fontWeight: '600' }],
          'headline-md': ['24px', { lineHeight: '32px', fontWeight: '600' }],
          'headline-sm': ['20px', { lineHeight: '28px', fontWeight: '700' }],
          'body-sm': ['12px', { lineHeight: '16px', fontWeight: '400' }],
          'label-bold': ['11px', { lineHeight: '12px', letterSpacing: '0.05em', fontWeight: '700' }],
          'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
          'display-kpi': ['48px', { lineHeight: '56px', letterSpacing: '-0.02em', fontWeight: '700' }],
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="/css/brand.css" />
</head>
<body class="bg-background font-body-md text-on-background min-h-screen flex">

<!-- Sidebar -->
<nav id="sidebar" class="fixed left-0 top-0 h-screen w-[240px] bg-surface-container border-r border-outline-variant flex flex-col z-40">
  <div class="p-6 border-b border-outline-variant flex items-center gap-3">
    <div class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold shrink-0">SF</div>
    <div class="min-w-0">
      <h1 class="text-headline-md font-headline-md font-extrabold text-primary leading-tight truncate">SalesForce CRM</h1>
      <p class="text-body-sm font-body-sm text-on-surface-variant truncate">Ventas Alta Velocidad</p>
    </div>
  </div>
  <ul id="nav-list" class="flex-1 overflow-y-auto py-4 px-2 space-y-1">
    <li><a data-route="ventas" href="#/ventas" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined">payments</span><span class="text-label-bold font-label-bold">Ventas</span></a></li>
    <li><a data-route="sla" href="#/sla" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined">timer</span><span class="text-label-bold font-label-bold">SLA</span></a></li>
    <li><a data-route="informe" href="#/informe" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined">summarize</span><span class="text-label-bold font-label-bold">Informe</span></a></li>
    <li><a data-route="estadisticas" href="#/estadisticas" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined">leaderboard</span><span class="text-label-bold font-label-bold">Estadísticas</span></a></li>
    <li><a data-route="asesores" href="#/asesores" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined">group</span><span class="text-label-bold font-label-bold">Asesores</span></a></li>
    <li><a data-route="ajustes" href="#/ajustes" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined">settings</span><span class="text-label-bold font-label-bold">Ajustes</span></a></li>
  </ul>
  <div class="p-6 border-t border-outline-variant flex items-center gap-3">
    <div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center font-bold text-on-surface-variant shrink-0">A</div>
    <div class="min-w-0">
      <p class="text-label-bold font-label-bold truncate">Admin User</p>
      <p class="text-body-sm font-body-sm text-on-surface-variant truncate">Operador Sr.</p>
    </div>
  </div>
</nav>

<!-- Main column -->
<div id="main-col" class="flex-1 ml-[240px] flex flex-col min-h-screen">
  <header id="topbar" class="flex justify-between items-center w-full h-16 px-margin-desktop sticky top-0 z-30 bg-surface border-b border-outline-variant">
    <h2 id="page-title" class="text-headline-sm font-headline-sm font-bold text-primary">CRM Operativo</h2>
    <div class="flex items-center gap-4">
      <div class="relative hidden md:block">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
        <input id="global-search" class="pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-sm font-body-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-64 transition-shadow" placeholder="Buscar cliente, ID..." type="text" />
      </div>
      <div class="relative">
        <button id="notif-btn" class="p-2 text-on-surface-variant hover:text-primary transition-colors relative" title="Notificaciones">
          <span class="material-symbols-outlined">notifications</span>
          <span id="notif-badge" class="hidden absolute -top-0.5 -right-0.5 bg-error text-on-error text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
        </button>
        <div id="notif-panel" class="hidden absolute right-0 mt-2 w-80 bg-surface border border-outline-variant rounded-lg shadow-xl z-50 max-h-96 overflow-y-auto"></div>
      </div>
      <button id="sla-badge-btn" class="hidden p-2 text-error hover:text-error/80 transition-colors relative" title="Leads críticos SLA">
        <span class="material-symbols-outlined">warning</span>
        <span id="sla-badge-count" class="absolute -top-0.5 -right-0.5 bg-error text-on-error text-[10px] font-bold rounded-full w-4 h-4 flex items-center justify-center">0</span>
      </button>
      <span id="conn-dot" class="w-2 h-2 rounded-full bg-outline-variant ml-1" title="Conectando…"></span>
    </div>
  </header>
  <main id="view-root" class="flex-1 p-margin-desktop"></main>
</div>

<div id="toast-root" class="fixed bottom-4 right-4 z-[100] flex flex-col gap-2"></div>

<script type="module" src="/js/auth.js"></script>
</body>
</html>
